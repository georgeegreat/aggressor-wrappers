# AGGRESSOR wrappers configuration
# Edit weights/thresholds here; no code changes required for retuning.

[cache]
# Raw copies: cache/{protein_id}/{predictor}/raw.{ext} (only with CLI --keep-cache)
root = cache
enabled = false

[pipeline]
# Default predictors for aggressor-wrappers / aggressor-wrappers.py (comma-separated).
# PATH is the only structure-based predictor and the only one needing two
# licensed dependencies (Modeller + PyRosetta). It is opt-in rather than default:
#   pip install .[path]   and add 'path' below (or pass --predictors).
predictors = appnn,waltz,pasta,archcandy,crossbeta,aggreprot,foldamyloid,aggrescan
# How many predictors to run at once. Predictors are independent, so wall time
# becomes max(T_predictor) rather than sum(T_predictor). Each runner still honours
# its own [runners.*] parallel_jobs / sequences_per_run caps, so external services
# see no extra load. Set to 1 for the previous strictly-sequential behaviour.
predictor_jobs = 4

[metascore]
# weighted_sum         - raw weighted sum. DEPRECATED: sums scores on incomparable
#                        scales (WALTZ 0-100 vs APPNN 0-1) and adds PASTA, whose
#                        energy is inverted, with a positive weight. Kept only so
#                        existing results stay reproducible.
# zscore_consensus     - standardised + polarity-corrected weighted consensus.
# fractional_consensus - evidence-count consensus over the per-tool binary calls;
#                        scale-free and polarity-correct by construction.
method = weighted_sum
# Active preset (override with AGGRESSOR_METASCORE_PRESET env var):
preset = predictor_specificity

# Metascore uses 7 predictors; AggreProt is in the pipeline but not weighted yet.
# Keys match predictor registry (schema.py).

[metascore.presets.functional_amyloids]
# Functional amyloid emphasis — higher WALTZ / PATH / APPNN / PASTA
waltz = 0.24
path = 0.22
appnn = 0.20
crossbeta = 0.10
pasta = 0.16
archcandy = 0.05
aggrescan = 0.03

[metascore.presets.pathogenic_amyloids]
# Pathogenic amyloid emphasis — higher Cross-Beta / APPNN / PATH
waltz = 0.17
path = 0.18
appnn = 0.19
crossbeta = 0.20
pasta = 0.14
archcandy = 0.08
aggrescan = 0.04

[metascore.presets.predictor_specificity]
# Conservative weights by tool specificity (default)
waltz = 0.22
path = 0.20
appnn = 0.19
crossbeta = 0.15
pasta = 0.15
archcandy = 0.06
aggrescan = 0.03

[predictors.path]
threshold_percentile = 75.0

[predictors.appnn]
score_threshold = 0.5

[predictors.pasta]
energy_threshold = -2.8

[predictors.aggreprot]
# Binarisation cutoff (legacy notebook: 0.25). Live loschmidt API: RPL27 BHT bins
# match at 0.24 on fresh runs; stored BHT scores peak at 0.25 in the 0.20–0.30 range.
aggregation_threshold = 0.25

[runners.aggreprot]
# AggreProt. TWO runners, and the difference is what the job can carry:
#
#   aggreprot      (default, used by a panel run) -- submits by itself:
#                  POST /api/jobs allocates a six-character id, then
#                  PUT /api/jobs/{id} carries the sequences. Unattended, up to
#                  3 sequences per job. NO structure channel: the server
#                  rejects structSource and null structure placeholders, so
#                  every residue comes back with sasa = null.
#   aggreprot_web  -- retrieval only, for a job submitted through the page.
#                  The structure is chosen on step 2 of that page, which is the
#                  only place it can be chosen. AggreProtWebRunner.recipe(fasta)
#                  emits the click sequence; pass the resulting job id back.
#
# Retrieval for both is anonymous and needs no token or cookie. The default is
# GET /api/jobs/{id}.csv?download=true -- what "Download results (CSV)" links
# to, a plain <a href>, so nothing reaches a downloads folder. That CSV is the
# primary path because its layout is what amyloscope's aggreprot adapter
# already reads; GET /api/jobs/{id} returns the same numbers as JSON (verified
# identical to 1e-12) and is kept as a fallback and for job metadata.
#
# pdb_id: structure for the step-2 selector -- fills "Enter PDB ID" (WWPDB);
# empty selects "No structure". It is not cosmetic: solvent accessibility is
# what separates a buried aggregation-prone segment from an exposed one. Set it
# ONLY together with runner aggreprot_web; setting it while the default
# aggreprot runner submits is now an error rather than a silently
# structure-free run.
pdb_id =
# AggreProt web service (https://loschmidt.chemi.muni.cz/aggreprot/)
base_url = https://loschmidt.chemi.muni.cz/aggreprot
poll_interval_seconds = 3
timeout_seconds = 3600
verify_ssl = false
# Up to 3 sequences per API job (site limit); unique FASTA headers required.
sequences_per_run = 3

[predictors.crossbeta]
# Binarisation threshold; legacy BHT tables used 0.54 (not the web default 0.5).
confidence_threshold = 0.54

[runners.crossbeta]
# Cross-Beta-Pred 2.0 REST API, at POST /api/tools/crossbetaPred/jobs (note the
# lower-case b; the capitalised spelling 404s). The API is anonymous -- a POST
# with no cookie and no token returns 201 -- so the reCAPTCHA on the page form
# is a front-end widget, not a gate on the service, and nothing here works
# around it. An earlier version of this config refused to submit on the strength
# of that widget; that was wrong.
# Results: GET .../jobs/{id}/files/result (JSON; there is no CSV member).
# The web PAGE caps input at 1000 characters; the API did not reject longer.

# --- backend choice -----------------------------------------------------------
# auto: the local checkout when repo_path resolves to the script, else the 2.0
# REST API. Decided before any network call, so a dead service costs nothing.
backend = auto

# --- web arm (Cross-Beta-Pred 2.0 REST, runners/crossbeta_v2.py) --------------
base_url = https://bioinfo.crbm.cnrs.fr/
poll_interval_seconds = 2
timeout_seconds = 1800
# verify_ssl removed: the 2.0 API is HTTPS with a valid certificate and the
# runner never disables verification.

# --- local arm (runners/crossbeta_local.py) -----------------------------------
# A checkout of Valentin-Gonay/cross-beta-predictor. The presence test is the
# SCRIPT, not the directory, so a half-cloned path is not reported as available.
# IUPred3 is separately licensed and must be unpacked into utils/iupred3/.
repo_path = /opt/cross-beta-predictor

# --- shared -------------------------------------------------------------------
threshold = 0.54
window_size = auto
parallel_jobs = 2
sequences_per_run = 1

[predictors.archcandy]
# score_mode lives HERE and only here. It was previously declared in both
# [predictors.archcandy] (cumulative) and [runners.archcandy] (highest), and
# which value applied depended on the entry point: get_runner() read the runner
# section, get_parser() read this one. The same ArchCandy output therefore
# scored differently through `aggressor-run` and through `aggressor-parse`.
#
# highest  - a residue takes the best single beta-arch covering it, so scores
#            stay on ArchCandy's own [0, 1] confidence scale and remain
#            comparable to its published threshold.
# cumulative - overlapping arches are summed. This matches the web UI's default
#            tab but conflates confidence with the NUMBER of overlapping
#            candidates: on a 99-residue test sequence ArchCandy emitted 16
#            overlapping arches, inflating a 0.723 maximum to 2.408. A score
#            above 1.0 is not an ArchCandy score any more.
score_mode = highest

[runners.archcandy]
# ArchCandy. backend = auto|local|web (see core/backend.py). 'auto' runs the
# local JAR when jar_path resolves, else the ArchCandy 2.0 REST API — decided
# before any network call, so a dead service costs nothing.
#
# The web arm is ArchCandy 2.0 at https://bioinfo.crbm.cnrs.fr/archCandy
# (POST /api/tools/archCandy/jobs; see runners/archcandy_v2.py). The BiSMM site
# was rebuilt and the old index.php?route=tools&tool=7 entry point no longer
# exists, so the 1.x runner could only return a dead link; it is retired to
# legacy/runners/archcandy_v1_deprecated.py. Reparsing historical ArchCandy 1.0
# files is unaffected -- that is predictors/archcandy.py, which stays live.
#
# The two arms are two PROGRAMS: the service is 2.0, the downloadable JAR is 1.0.
# Options are grouped accordingly, because a value that is right for one is wrong
# for the other, and `threshold` is the case in point.

# --- backend choice -----------------------------------------------------------
backend = auto

# --- local arm (ArchCandy 1.0 JAR, runners/archcandy_local.py) ----------------
jar_path = /opt/archcandy/ArchCandy_01.09.2014.jar
java = java
# ArchCandy 1.0's published cutoff (Ahmed et al., 2015). Read ONLY when the local
# backend wins, and it is not 2.0's 0.57. Nothing read this key before, so a
# local run silently used the web threshold.
local_threshold = 0.56

# --- web arm (ArchCandy 2.0 REST, runners/archcandy_v2.py) --------------------
base_url = https://bioinfo.crbm.cnrs.fr/
# ArchCandy thresholds are VERSION-specific and must not be mixed:
#   0.40  ArchCandy 2.0 web default (a recall-oriented submission filter)
#   0.57  ArchCandy 2.0 significance boundary
#   0.56  ArchCandy 1.0 published threshold (Ahmed et al., 2015) -- 1.0 is the
#         only downloadable build, so this is the number that applies to any
#         local run, and it is NOT 2.0's 0.57. Set as local_threshold above.
# ArchCandy 2.0's own documentation gives the calibration, and it is a THREE-band
# scale, not a single cutoff:
#     score < 0.40          prediction is non-significant
#     0.40 <= score < 0.57  ambiguous
#     score >= 0.57         significant
# 0.40 is the web default (a recall-oriented submission filter); 0.57 is the
# significance boundary. This panel runs 0.57, i.e. significant calls only.
#
# NOTE for the amyloscope ribosomal config, which launches the local build at
# 0.24: that is below even the non-significance floor, so every arch it retains
# is one the authors' benchmark classifies as non-significant. Lowering the cut
# to obtain calls from an otherwise silent protein does not weaken the claim
# gracefully -- it changes what the number means.
threshold = 0.57
# score_mode intentionally absent: see [predictors.archcandy].
transmembrane = false
poll_interval_seconds = 2
timeout_seconds = 1800
# verify_ssl removed: ArchCandy 2.0 is HTTPS with a valid certificate, and the
# runner never disables verification.
# One sequence per API job; optional parallel_jobs for concurrent submissions.
parallel_jobs = 2
sequences_per_run = 1

[predictors.tango]
threshold = 5.0
# 'Aggregation' (beta-aggregation propensity, 0-100 %) is the column the
# literature thresholds. 'Conc-Stab_Aggregation' is the concentration/stability
# corrected variant and is kept as an aux channel either way.
score_column = Aggregation

[runners.tango]
# TANGO is licensed, platform-specific, and has NO web service: local-only.
# Leave it out of [pipeline] predictors on machines without the binary.
backend = local
binary_path = /opt/tango/tango_x86_64_release
nt = N
ct = N
ph = 7.0
te = 298.15
io = 0.02

[predictors.amylogram]
threshold = 0.5

[runners.amylogram]
backend = auto
rscript = Rscript
# AmyloGram is an n-gram model trained on hexapeptides, so whole-protein input is
# outside its fitted regime. Sliding windows of its training unit are scored and
# projected back onto residues.
#
# windows: query widths, comma separated. 6 is the training unit; anything wider
# is outside the fitted distribution (the runner warns) and is a
# boundary-sensitivity device, kept as a w{n}_Score column, not a prediction.
windows = 6
#
# aggregation: how the windows covering a residue collapse to one score.
#   support (default) - the score reached if `support_fraction` of the covering
#                       windows must be at least that high. One interpretable
#                       knob spanning max (f = 1/w) to min (f = 1).
#   median / mean     - boundary-faithful; recovered the true APR extent exactly
#                       in tests/test_amylogram_projection.py, at both a 6-aa
#                       and a 35-aa core.
#   max               - a residue is called if it lies in ANY amyloidogenic
#                       hexapeptide. Systematically broad: the called region
#                       grows by roughly half a window at each end, which
#                       DOUBLES a hexapeptide-scale APR (6 -> 12 aa) while
#                       costing a NAC-scale one only ~17 % (35 -> 41 aa).
aggregation = support
# 0.5 asks for majority support among the covering windows. It lands one residue
# permissive of the exact boundary at each end, which is the deliberate error
# direction: amyloscope's min_region_length filter can only DELETE regions, so
# under-calling can erase a genuine short APR outright while a one-residue
# margin cannot.
support_fraction = 0.5
# Used only when aggregation = quantile. 0 = max, 1 = min, on the descending order.
quantile = 0.5
# Used only when several widths are requested: how their projections combine.
combine = max

[predictors.amylodeep]
threshold = 0.5

[runners.amylodeep]
backend = local
executable = amylodeep
output_format = csv
# Output grain and projection, passed explicitly rather than inherited: the CLI
# default moved between versions (0.3 wrote one row per WINDOW at window 10, 0.4
# one row per RESIDUE at window 6), so an implicit default would make the same
# config produce two different profiles depending only on what is installed.
# resolution: residue (what the parser wants) | window (0.3's shape) | both
resolution = residue
# window_size: 6 recovers a 6-residue APR exactly; 10 overshoots it by 4 residues.
window_size = 6
# aggregate: mean | max | support. mean contracts onto the segment actually scored
# high; max widens a boundary by up to window_size - 1 residues.
aggregate = mean
# Leave all three blank for an amylodeep older than 0.4, which rejects the flags.

[runners.path]
# Default: vendor/PATH/path1.1.py (bundled). Use conda env `AGGRESSOR` (see environment.yml).
# Override: AGGRESSOR_PATH_SCRIPT, AGGRESSOR_PATH_PYTHON
script = /Users/kseniasuhanova/iCloud/Documents/Documents_icloud/Lab_amyloids/Projects/Cub_hackathon/Tools/PATH/path1.1.py
python = python3
results_filename = results.csv
# 0 = no timeout (PATH can run for hours on long proteins)
timeout_seconds = 0
# Multifasta batching: one sequence per subprocess; up to 2 concurrent PATH runs.
parallel_jobs = 2
sequences_per_run = 1

[runners.appnn]
rscript = Rscript
# Default: package legacy/appnn_converter.R (override with AGGRESSOR_APPNN_SCRIPT)
converter_script =
output_dir = APPNN_parsed
timeout_seconds = 0
# APPNN is fast — all sequences in a single R invocation (omit parallel_jobs / sequences_per_run).

[predictors.waltz]
# Binary when score != 0

[runners.waltz]
# WALTZ web service (https://waltz.switchlab.org/)
base_url = https://waltz.switchlab.org/
threshold = 92
ph = 7.0
# output: text_short | text_long | text_long_graph
# ONLY text_long_graph yields the per-residue WaltzJob_<id>_<n>.dat files
# (position<TAB>score, zero outside matrix hits) that amyloscope's `waltz`
# adapter reads. Under text_long the archive holds a region table and nothing
# positional. Use WALTZRunner.fetch_per_residue() to harvest the .dat files;
# it submits a second job in graph mode, because WALTZ fixes the archive's
# contents at submission time.
output_format = text_long
timeout_seconds = 600
# Up to 10 sequences per web job (server limit ~10000 letters per POST).
sequences_per_run = 10

[runners.pasta]
# PASTA 2.0 web service (http://old.protein.bio.unipd.it/pasta2/)
#
# profile_kind = free_energy | aggregation
# The archive ships BOTH <name>.fasta.seq.aggr_profile.dat and
# <name>.fasta.seq.aggr_profile.dat.free_energy. PASTA scores a pairing FREE
# ENERGY -- more negative means a more stable cross-beta pairing -- so the
# free-energy profile is the one a `below` threshold applies to, and it is what
# the amyloscope ribosomal config already reads.
profile_kind = free_energy
#
# NOTE: PASTA rewrites FASTA headers before naming its outputs, keeping only
# word characters: 6087.XP_002162002.2 becomes 6087XP_0021620022 and
# 7029.ACYPI000203-PA becomes 7029ACYPI000203PA. The runner maps accessions
# through that rewrite; it also refuses a batch in which two accessions collapse
# onto the same name, since the rewrite is lossy.
base_url = http://old.protein.bio.unipd.it/pasta2/
npair = 22
amount = -2.8
thresdrop = val1
poll_interval_seconds = 10
timeout_seconds = 3600
# Up to 10 sequences per web job (Regular mode).
sequences_per_run = 10

[predictors.foldamyloid]
# FoldAmyloid's own `f` flag is authoritative: it embeds both the 21.4 cutoff
# and the 5-residue frame averaging, neither of which the export records.
use_tool_flag = true
threshold = 21.4

[runners.foldamyloid]
# FoldAmyloid web service. No API is published; the wrapper posts to the same
# worker.php endpoint the page uses (see runners/foldamyloid.py for the
# recovered request/response contract). Local-only? No: there is no downloadable
# build, so this predictor is web or nothing.
backend = web
base_url = http://bioinfo.protres.ru/fold-amyloid/
averaging_frame = 5
threshold = 21.4
timeout_seconds = 600
sequences_per_run = 1
parallel_jobs = 1

[predictors.aggrescan]
# AGGRESCAN's own Hot Spot calls are authoritative; they embed both the
# threshold and the length-dependent averaging window.
use_tool_flag = true

[runners.aggrescan]
# AGGRESCAN web service. Local-only? No: there is no downloadable build.
# The server exports ONLY the global descriptors (aap_<job>.txt.xls); the
# per-residue profile exists solely in the result HTML, so the runner scrapes
# it and writes the Number,AA,a4v,HSA,NHSA,a4vAHS,Prediction table itself.
backend = web
# Any URL on the AGGRESCAN host works: the submission CGI is resolved against
# scheme+host (/bioinf/cgi-bin/aap/aap_ov.pl), not against this path, because
# the CGI sits one level above the tool page.
base_url = http://andromeda.uab.cat/bioinf/aggrescan/
# Hot Spot = a4v above the threshold over a minimum run of consecutive residues
# (Conchillo-Sole et al., 2007). Using HSA > 0 instead over-calls: on Abeta42 it
# adds an isolated Y10 that AGGRESCAN itself does not count (nHS = 2, not 3).
hot_spot_threshold = -0.02
min_hot_spot_run = 5
# Cross-check the derived mask against the nHS the server reports, and fail on a
# mismatch rather than shipping a different definition of a Hot Spot.
verify_reported_nhs = true
timeout_seconds = 600
sequences_per_run = 1
parallel_jobs = 1
